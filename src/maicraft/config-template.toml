# Maicraft配置模板

# 文件元数据

[meta]
# 配置结构版本（只读，由升级流程自动推进）
version = "0.4.0"

[logging]
# 是否写日志文件
enabled = true
# 文件里每行是纯文本（text）还是一个 JSON 对象（jsonl）
format = "text"
# 日志目录，相对运行目录
directory = "logs"
# 写进文件的最低级别
level = "INFO"
# 控制台的最低级别
console_level = "INFO"
# 单个文件多大时轮转
rotation = "10 MB"
# 轮转出的旧文件保留多久
retention = "7 days"
# 轮转出的旧文件的压缩格式
compression = "zip"

[llm]
# 模型名称
model = "gpt-4o-mini"
# API密钥
api_key = ""
# API基础URL，留空使用服务方默认地址
base_url = ""
# 温度参数，越高越发散
temperature = 0.2
# 单次回复的最大token数
max_tokens = 4096
# 模型能不能看图；false 时 mod 发来的画面只把旁边的文字给模型
supports_vision = false
# 单次模型请求的超时秒数
request_timeout_s = 120.0

[mod]
# mod 的 MCP 端点地址
url = "http://127.0.0.1:8766/mcp"
# 事件长轮询的单次等待毫秒数
events_wait_ms = 25000

[agent]
# 一轮对话里最多执行的动作步数
max_steps_per_turn = 30
# 空闲多少分钟后主动叫醒模型；0 表示不主动叫醒
idle_replan_minutes = 10
# 连续多少轮没有实际动作后停下
max_empty_turns = 3
# 长期目标，原样放进提示词
long_term_goal = ""
# 提示词里保留最近几条动作结果
keep_recent_results = 6

[chat]
# 除角色名之外还接受哪些称呼
mention_names = []
# 把相邻消息合并处理的等待毫秒数
batch_window_ms = 2000

[maigo]
# 是否启用 Maigo 对接
enabled = false
# Maigo 服务地址
url = "http://127.0.0.1:8768"
# 在 Maigo 里使用的分支标识
branch_id = "maicraft"
